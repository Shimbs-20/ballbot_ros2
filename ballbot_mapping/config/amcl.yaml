amcl:
  ros__parameters:

    # ── Motion model ───────────────────────────────────────────────
    robot_model_type: "nav2_amcl::OmniMotionModel"

    # ── Frame IDs ──────────────────────────────────────────────────
    base_frame_id:   "base_footprint"
    odom_frame_id:   "odom"
    global_frame_id: "map"
    scan_topic:      "/scan"

    # ── Particle filter ────────────────────────────────────────────
    min_particles: 500
    max_particles: 2000

    # ── Update thresholds ──────────────────────────────────────────
    update_min_d: 0.2
    update_min_a: 0.2

    # ── Laser sensor model ─────────────────────────────────────────
    laser_max_range:   12.0
    laser_min_range:    0.12
    max_beams:          60
    laser_model_type: "likelihood_field"
    sigma_hit:        0.02
    z_hit:            0.5
    z_rand:           0.5
    laser_likelihood_max_dist: 2.0

    # ── Omni motion model noise ────────────────────────────────────
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.1

    # ── Recovery ───────────────────────────────────────────────────
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1

    # ── TF tolerance ───────────────────────────────────────────────
    transform_tolerance: 1.0

    # ── FIX: set_initial_pose stops the warning automatically ──────
    # AMCL starts with particles at this position instead of waiting
    # for /initialpose topic. 
    # small_house map origin = [-12.5, -12.5]
    # Robot spawns at Gazebo origin = world (0,0)
    # In map frame: [0 - (-12.5), 0 - (-12.5)] = [12.5, 12.5]
    # Use RViz "2D Pose Estimate" or set_initial_pose.sh to correct
    # if robot is not actually at this location.
    set_initial_pose: true
    initial_pose:
      x:   12.5
      y:   12.5
      z:   0.0
      yaw: 0.0

    resample_interval: 1
    save_pose_rate:    0.5