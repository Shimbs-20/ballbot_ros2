# ballbot_mapping/config/amcl.yaml — REAL ROBOT config
# Used by: slam.launch.py (real robot, use_sim_time: false)
#          nav2.launch.py (real robot, use_sim_time: false)
amcl:
  ros__parameters:
    use_sim_time: false
 
    # OmniMotionModel is MANDATORY for holonomic ballbot
    robot_model_type: "nav2_amcl::OmniMotionModel"
 
    # Odometry noise — alpha5 is lateral strafe noise (Omni only)
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.1
 
    base_frame_id:       "base_footprint"
    odom_frame_id:       "odom"
    global_frame_id:     "map"
    scan_topic:          "scan"
    tf_broadcast:        true
    transform_tolerance: 1.0
 
    laser_model_type:          "likelihood_field"
    laser_min_range:           0.12
    laser_max_range:           12.0
    laser_likelihood_max_dist: 2.0
    max_beams:                 180
    do_beamskip:               true
    beam_skip_distance:        0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold:       0.3
    z_hit:        0.5
    z_max:        0.05
    z_rand:       0.5
    z_short:      0.05
    sigma_hit:    0.2
    lambda_short: 0.1
 
    min_particles:     500
    max_particles:     3000
    pf_err:            0.05
    pf_z:              0.99
    resample_interval: 1
 
    update_min_d: 0.15
    update_min_a: 0.15
 
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
 
    save_pose_rate: 0.5
 

    set_initial_pose: true
    initial_pose:
      x:   0.0
      y:   0.0
      z:   0.0
      yaw: 0.0
 
