# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# nav2_param.yaml — Ballbot Navigation Stack
# Holonomic omniwheel robot — Pi 4 optimised
#
# Key differences from standard Nav2 config:
#   - MPPI with motion_model: Omni  (exploits vx+vy+wz)
#   - vy_max: 0.5  (enables lateral strafe — the whole point)
#   - SmacPlanner2D  (no heading constraint — correct for holonomic)
#   - robot_base_frame: base_footprint  (matches URDF)
#   - odom_topic: /odom  (not /ballbot_controller/odom — that was wrong)
#   - controller_frequency: 10Hz  (Pi 4 MPPI limit at 500 samples)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ══════════════════════════════════════════════════════════════
# BT NAVIGATOR
# ══════════════════════════════════════════════════════════════
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint       
    odom_topic: /odom                      
    bt_loop_duration: 10
    default_server_timeout: 20
    transform_tolerance: 0.3
    default_nav_to_pose_bt_xml: ""

# ══════════════════════════════════════════════════════════════
# CONTROLLER SERVER — MPPI
# ══════════════════════════════════════════════════════════════
controller_server:
  ros__parameters:
    use_sim_time: false
    # 10Hz — Pi 4 limit with 500 MPPI samples
    # Higher frequency = less stable balance, more CPU
    controller_frequency: 10.0
    # Thresholds below which robot is considered "stopped"
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001    # FIX: was 0.5 — way too high, ignored vy entirely
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    odom_topic: /odom                   # FIX: was /ballbot_controller/odom

    # ── Progress checker ──────────────────────────────────────
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3    # reduced — small rooms
      movement_time_allowance: 15.0    # generous — balancing robot is slow to start

    # ── Goal checker ─────────────────────────────────────────
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15          # 15cm — good for indoor navigation
      yaw_goal_tolerance: 0.25         # ~14° — ballbot doesn't need precise heading

    # ── MPPI Controller ───────────────────────────────────────
    # This is the core of holonomic navigation.
    # motion_model: Omni unlocks simultaneous vx + vy + wz.
    # Without this, MPPI degrades to differential behaviour.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # Trajectory horizon: 30 steps × 0.1s = 3 seconds lookahead
      # Increase time_steps for smoother paths, decrease for faster reaction
      time_steps: 30
      model_dt: 0.1
      batch_size: 300          # Pi 4 limit — increase to 1000 on faster hardware
      iteration_count: 1       # 1 iteration per control tick — sufficient for Pi 4

      # ── Velocity limits — must match STM32 bridge limits ──
      vx_max:  0.5
      vx_min: -0.5
      vy_max:  0.5             # ← THIS is what makes it holonomic
      vy_min: -0.5             # ← Without these two lines, no strafing
      wz_max:  1.0
      wz_min: -1.0

      # Acceleration limits — gentle for a balance robot
      # Too aggressive = robot tips over before LQR can compensate
      ax_max:  0.3
      ax_min: -0.3
      ay_max:  0.3             # lateral acceleration
      ay_min: -0.3
      az_max:  0.5             # angular acceleration

      # ── Omni kinematic model ──────────────────────────────
      motion_model: "Omni"     # CRITICAL — sets holonomic kinematics

      prune_distance: 1.5
      transform_tolerance: 1.0
      enforce_path_inversion: false  # holonomic robots don't need to reverse

      # ── Critics — each scores a different aspect of trajectory ──
      critics: [
        "ConstraintCritic",    # enforces velocity limits
        "ObstaclesCritic",     # avoids obstacles in costmap
        "GoalCritic",          # drives toward goal
        "PathAlignCritic",     # follows the global path
        "PathFollowCritic",    # stays on pace along path
        "TwirlingCritic",      # IMPORTANT: stops ballbot spinning randomly
      ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        cost_weight: 35.0      # high — crash = robot falls over
        consider_footprint: false
        collision_cost: 10000.0
        collision_margin_distance: 0.1
        near_goal_distance: 0.5

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        threshold_to_consider: 1.4

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false  # false = holonomic, ignores path heading

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        offset_from_furtherpoint: 1
        trajectory_point_step: 3
        threshold_to_consider: 1.4

      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0      # penalises spinning — ballbot tends to rotate
                                # while strafing if this is disabled

# ══════════════════════════════════════════════════════════════
# PLANNER SERVER — SmacPlanner2D
# ══════════════════════════════════════════════════════════════
planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    expected_planner_frequency: 1.0    # replan at 1Hz — only needed on new goal

    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.2
      allow_unknown: true              # navigate into unmapped areas
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false  # holonomic — don't care about final heading

# ══════════════════════════════════════════════════════════════
# BEHAVIOR SERVER — Recovery behaviours
# Includes Spin + BackUp + Wait
# Strafe recovery would require a custom plugin (future work)
# ══════════════════════════════════════════════════════════════
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    global_frame: odom
    robot_base_frame: base_footprint     # FIX: was base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"

# ══════════════════════════════════════════════════════════════
# LOCAL COSTMAP — 3×3m rolling window around robot
# Updated from live lidar at 5Hz
# MPPI uses this for real-time obstacle avoidance
# ══════════════════════════════════════════════════════════════
# nav2_param_shelf.yaml
# Identical to nav2_param.yaml but obstacle_layer is DISABLED.
# Use for shelf testing when lidar is enclosed in a tight space.
#
# Usage:
#   Copy over nav2_param.yaml temporarily, or pass as param file:
#   Just change this one line in the local_costmap:
#     plugins: ["static_layer", "inflation_layer"]  # obstacle_layer removed
#
# Switch back to full navigation by restoring:
#     plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      # ── SHELF TEST: obstacle_layer removed ───────────────────
      # Lidar sees walls 5cm away on shelf → costmap fully blocked
      # Remove obstacle_layer so MPPI can plan freely during testing
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: true
      
# ══════════════════════════════════════════════════════════════
# GLOBAL COSTMAP — full map, updated slowly
# SmacPlanner2D uses this for path planning
# ══════════════════════════════════════════════════════════════
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0             # walls don't move — 1Hz is enough
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint  # FIX: was base_link
      robot_radius: 0.22
      plugins: ["static_layer", "inflation_layer"]
      always_send_full_costmap: true    # ← ADD THIS LINE

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35

# ══════════════════════════════════════════════════════════════
# SMOOTHER SERVER
# Smooths the global path before MPPI follows it
# ══════════════════════════════════════════════════════════════
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      do_refinement: true
      refinement_num: 2
      max_its: 1000
      w_data: 0.2
      w_smooth: 0.3
      enforce_path_inversion: false    # FIX: was True — wrong for holonomic